# Frozen verdict matrix for the sponsorship classifier.
#
# WHY THIS FILE EXISTS. `assess_sponsorship` has been revised five times, and
# the first three revisions each fixed one direction of the same rule by
# reopening the other (`memory/decisions/sponsorship-an-unsettled-denial-is-
# review-not-a-silent-drop.md`). What finally worked was a matrix of readings
# measured BEFORE and AFTER every single change, in which "change nothing" is an
# allowed outcome for any row. That matrix was rebuilt by hand each time and
# never tracked, so each pass paid to rediscover it. This is that matrix, frozen.
#
# HOW TO READ A ROW.
#   `baseline` is the reading measured at the commit named in `baseline_ref`.
#     It is HISTORY: never edit it, never re-measure it. Some baselines are
#     deliberately WRONG — that is the point, they record what the classifier
#     actually did before a change, not what it should do.
#   `expect` is the asserted CURRENT reading. It appears only on rows a landed
#     change deliberately moved. When absent, `baseline` is what is asserted.
#   `change` is the prediction that was recorded before the work started:
#     `expected-unchanged` rows are tripwires and may never carry an `expect`
#     block; `expected-change` rows are targets, and a target that did not move
#     is a reported outcome, not a failure.
#
# HOW TO RUN IT.
#   .venv/bin/python skills/job-search/scripts/sponsorship_matrix.py --check
#   .venv/bin/python skills/job-search/scripts/sponsorship_matrix.py --diff
# `--check` is also wired into the unit suite
# (`skills/job-search/scripts/tests/test_sponsorship_matrix.py`).
#
# All text here is FICTIONAL. This file is public.
