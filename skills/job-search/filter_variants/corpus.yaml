  - id: yoe-general-required
    domain: yoe
    input:
      text: Requires at least 8 years of professional experience.
    expect:
      decision: match
      min: 8
      confidence: high
      requirement_kind: required

  - id: yoe-tool-contextual
    domain: yoe
    input:
      text: Requires 8+ years of experience with Kubernetes.
    expect:
      decision: review
      min: 8
      confidence: medium
      requirement_kind: contextual

  - id: yoe-general-then-adjacent-leadership-clause
    domain: yoe
    # Regression: a high, general requirement immediately followed by a lower,
    # contextual leadership clause. The adjacent clause's "years in senior
    # leadership" wording must NOT bleed into the 15-year match's look-ahead and
    # downgrade it to contextual/medium. It stays high/general/required so the
    # documented max_years_experience hard gate keeps firing (no_match at a cap
    # below 15 — exercised directly in the job-metadata unit tests, since the
    # corpus runs the cap-free assessment).
    input:
      text: >-
        Requires 15+ years of software engineering experience with at least
        5+ years in senior leadership roles.
    expect:
      decision: match
      min: 15
      confidence: high
      requirement_kind: required

  - id: yoe-adjacent-tool-clauses-stay-contextual
    domain: yoe
    # Guardrail for the same fix: two genuine tool/domain clauses joined by a
    # conjunction each stay contextual/medium, so the decisive requirement is a
    # non-hard-drop review — the scoping change must not over-promote a real
    # tool-specific requirement to a high, general gate.
    input:
      text: >-
        Requires 8+ years of experience with Kubernetes and 5+ years working
        with Terraform.
    expect:
      decision: review
      min: 8
      confidence: medium
      requirement_kind: contextual

  - id: yoe-weak-general-required
    domain: yoe
    # A stated general requirement with no "required/minimum/must" cue and no
    # "professional/industry" qualifier is only MEDIUM confidence, so it is a
    # non-decisive review requirement rather than a hard filter — an intentional,
    # recurring family that must not be treated as a novel unlabeled variant.
    input:
      text: Strong candidates bring 5 or more years building distributed systems.
    expect:
      decision: review
      min: 5
      confidence: medium
      requirement_kind: required

  - id: yoe-third-party-founder-experience
    domain: yoe
    # An About-us sentence. The years belong to the employer's founders, so they
    # are not a requirement at all — they used to be read as a 25-year minimum
    # and hard-dropped the posting under max_years_experience.
    input:
      text: Our founders bring 25 years of engineering experience.
    expect:
      decision: review
      min: null
      confidence: unknown
      requirement_kind: not_stated

  - id: yoe-third-party-combined-team-total
    domain: yoe
    # "combined" makes the number a team total by construction.
    input:
      text: Our team has 30 years of combined software engineering experience.
    expect:
      decision: review
      min: null
      confidence: unknown
      requirement_kind: not_stated

  - id: yoe-company-blurb-then-real-requirement
    domain: yoe
    # Both sentences state years. The company-history one must not outrank the
    # applicant requirement, which is the number the gate is allowed to use.
    input:
      text: >-
        Our founders bring 25 years of engineering experience. Requires 3+ years
        of professional software engineering experience.
    expect:
      decision: match
      min: 3
      confidence: high
      requirement_kind: required

  - id: yoe-requirement-after-team-subject
    domain: yoe
    # Guardrail for the attribution guard: the sentence opens with a company
    # subject but turns back to the applicant, so the requirement still counts.
    input:
      text: >-
        Our engineering team is hiring an engineer with 6+ years of professional
        experience.
    expect:
      decision: match
      min: 6
      confidence: high
      requirement_kind: required

  - id: yoe-cued-general-phrasing-is-decisive
    domain: yoe
    # The most common way an English job post states a seniority requirement.
    # It used to grade tool-specific/medium: the contextual regex's optional
    # "(?:of\s+)?" backtracked and let the preposition "of" BE the tool name, so
    # "8 years <of> experience" read as a domain requirement. Only a HIGH grade
    # is decisive, so the documented max_years_experience cap silently did
    # nothing on these — "Minimum 7 years of experience" was kept at a cap of 6
    # while "Minimum 7 years of professional experience", the same requirement
    # one adjective apart, was correctly dropped.
    input:
      text: "Requirements: 8+ years of experience."
    expect:
      decision: match
      min: 8
      confidence: high
      requirement_kind: required

  - id: yoe-escaped-range-dash
    domain: yoe
    # markdownify escapes a hyphen that could start a list item, so a JD fetched
    # through JobSpy arrives as "3\-5 years". The escape hid the range separator
    # entirely: the range matched nothing and a min-only pattern then read the
    # range's UPPER bound as a standalone minimum, turning the band's CEILING
    # into its FLOOR. Escaped and unescaped text must grade identically.
    input:
      text: 'Requires 3\-5 years of professional experience.'
    expect:
      decision: match
      min: 3
      max: 5
      confidence: high
      requirement_kind: required

  # --- Intentional, recurring LOCATION review families ------------------------
  # These preserve a posting for manual review at scale; each is a KNOWN shape so
  # the strict snapshot audit does not fail on it, while runtime search still
  # keeps it in the review queue. A genuinely new conflict/polarity shape (a new
  # review-reason string) is still novel and still fails the audit.

  - id: location-unclassified-bare-workplace-word
    domain: location
    # A location string that is only a workplace word ("Hybrid", "In-Office")
    # names no classifiable geography -> unknown. The review reason is specific
    # rather than the `unclassified_location` catch-all: the board stated a work
    # MODE where a place belongs, so the fix is to read the posting, not to widen
    # any token list.
    input:
      title: Software Engineer
      location: Hybrid
      workplace_hint: unknown
      description: Join our team building reliable distributed services.
    policy:
      metro: [springfield]
      allow_us_remote: true
      us_only: true
      require_match: true
    expect:
      decision: review
      category: unknown
      review_contains: [workplace_tag_without_geography]

  - id: location-remote-grant-with-mandatory-hybrid-role
    domain: location
    # A genuine contradiction: the role is offered as remote AND described as a
    # (non-optional) hybrid role. Preserved as review, never silently matched.
    input:
      title: Software Engineer
      location: United States
      workplace_hint: unknown
      description: This position can be worked remotely. It is also a hybrid role.
    policy:
      metro: [springfield]
      allow_us_remote: true
      us_only: true
      require_match: true
    expect:
      decision: review
      review_contains: [remote_hybrid_conflict]

  - id: location-hybrid-tag-vs-jd-remote
    domain: location
    # The structured location tag says hybrid at a listed office while the JD says
    # the role is fully remote: which applies depends on the candidate, so review.
    input:
      title: Software Engineer
      location: Hybrid - Springfield
      workplace_hint: unknown
      description: This role is fully remote across the company.
    policy:
      metro: [springfield]
      allow_us_remote: true
      us_only: true
      require_match: true
    expect:
      decision: review
      category: metro
      review_contains: [location_hybrid_jd_remote_conflict]

  - id: location-untrusted-remote-hint
    domain: location
    # Market scrapers can mark an office posting as remote without corroborating
    # JD wording. Keep it in review; the hint alone never grants eligibility.
    input:
      title: Software Engineer
      location: Lakeview, WA, US
      workplace_hint: remote
      hint_trusted: false
      description: Build reliable distributed services with the platform team.
    policy:
      metro: [springfield]
      allow_us_remote: true
      us_only: true
      require_match: true
    expect:
      decision: review
      review_contains: [uncorroborated_ats_workplace_hint]

  - id: location-region-title-cannot-grant-us-remote
    domain: location
    # Boards that park a workplace WORD in the location field leave the gate with
    # no geography. A coverage region in the TITLE ("…, Americas") is a market
    # descriptor, not a work grant, so it must not carry the posting to a match.
    input:
      title: Solutions Architect, Americas
      location: In-Office
      workplace_hint: unknown
      description: >-
        This is a hybrid role and you will work from one of our offices three
        days per week.
    policy:
      metro: [springfield]
      allow_us_remote: true
      us_only: true
      require_match: true
    expect:
      decision: review
      category: unknown
      workplace: hybrid
      review_contains: [workplace_tag_without_geography]

  - id: location-us-region-with-office-obligation
    domain: location
    # Region-level US geography plus an EVIDENCED office obligation: the country
    # is known, the office is not, so neither the metro rule nor US-remote can be
    # confirmed. Reviewable — the unnamed office may be a preferred metro.
    input:
      title: Platform Engineer
      location: United States
      workplace_hint: unknown
      description: This is a hybrid role with three office days each week.
    policy:
      metro: [springfield]
      allow_us_remote: true
      us_only: true
      require_match: true
    expect:
      decision: review
      category: unknown
      review_contains: [us_scope_without_remote_workplace]

  - id: location-bare-hybrid-tag-yields-to-jd-remote
    domain: location
    # A bare "Hybrid" tag names no office to report to, so it cannot contradict
    # an explicit JD remote grant. A PLACE-BEARING hybrid location still can —
    # see location-preferred-metro-hybrid-vs-jd-remote above.
    input:
      title: Senior Software Engineer, Platform
      location: Hybrid
      workplace_hint: hybrid
      description: >-
        This is a fully remote role. You may live anywhere you are authorized to
        work. Available Locations: Remote - United States
    policy:
      metro: [springfield]
      allow_us_remote: true
      us_only: true
      require_match: true
    expect:
      decision: match
      category: us_remote
      workplace: remote
      evidence_contains: [jd_remote_over_bare_workplace_tag]

  - id: location-us-city-containing-a-country-name
    domain: location
    # "india" used to match inside "Indianapolis", so a plain US city classified
    # foreign and the posting was dropped at the search stage with no review
    # reason. Every token list is matched on word boundaries now.
    input:
      title: Software Engineer
      location: Remote (Indianapolis)
      workplace_hint: unknown
      description: Build reliable distributed services.
    policy:
      metro: [springfield]
      allow_us_remote: true
      us_only: true
      require_match: true
    expect:
      decision: match
      category: us_remote
      workplace: remote

  - id: location-title-word-cannot-manufacture-a-foreign-scope
    domain: location
    # The title joins the foreign-scope context, so "apac" inside "Capacity"
    # demoted a clean US-remote posting to a mixed-scope review.
    input:
      title: Software Engineer, Capacity Planning
      location: Remote - US
      workplace_hint: unknown
      description: Build reliable distributed services.
    policy:
      metro: [springfield]
      allow_us_remote: true
      us_only: true
      require_match: true
    expect:
      decision: match
      category: us_remote

  - id: location-foreign-city-with-its-own-country-code
    domain: location
    # 26 US state abbreviations are also ISO country codes. "IN" here
    # corroborates the country the same field already names, so it is India's
    # code and supplies no US signal.
    input:
      title: Software Engineer
      location: Bangalore, IN
      workplace_hint: unknown
      description: Build reliable distributed services.
    policy:
      metro: [springfield]
      allow_us_remote: true
      us_only: true
      require_match: true
    expect:
      decision: no_match
      category: foreign

  - id: location-us-city-with-a-colliding-state-code
    domain: location
    # Same shape, opposite reading: nothing here names India, so "IN" is
    # Indiana and the posting is a real (non-preferred) US office.
    input:
      title: Software Engineer
      location: Indianapolis, IN
      workplace_hint: unknown
      description: Build reliable distributed services.
    policy:
      metro: [springfield]
      allow_us_remote: true
      us_only: true
      require_match: true
    expect:
      decision: no_match
      category: other_us

  - id: location-contested-country-code-alone-is-undecidable
    domain: location
    # California or Canada — the field says nothing else. Neither verdict is
    # earned, so the posting is preserved for a human instead.
    input:
      title: Software Engineer
      location: Remote - CA
      workplace_hint: unknown
      description: Build reliable distributed services.
    policy:
      metro: [springfield]
      allow_us_remote: true
      us_only: true
      require_match: true
    expect:
      decision: review
      review_contains: [ambiguous_state_or_country_code]

  - id: location-third-party-remote-mention-is-not-a-grant
    domain: location
    # "<role> can/may/could ... remote" needs a verb binding remote to THIS
    # role; without one, a sentence about someone else's remote work turned an
    # onsite posting into a US-remote match.
    input:
      title: Software Engineer
      location: Columbus, OH
      workplace_hint: unknown
      description: >-
        The job may also involve mentoring remote interns during the summer.
    policy:
      metro: [springfield]
      allow_us_remote: true
      us_only: true
      require_match: true
    expect:
      decision: no_match
      category: other_us
      workplace: onsite

  - id: location-remote-grant-bound-to-a-non-preferred-metro
    domain: location
    # A remote GRANT is not a statement of geography. The JD grants remote work and
    # then requires residence in one metro; nothing read the restriction, so the
    # posting came back a CONFIDENT us_remote match the caller had no reason to
    # re-read. Three of four confident matches in one live re-check were this shape.
    input:
      title: Software Engineer
      location: Remote
      workplace_hint: unknown
      description: >-
        This is a remote role but the location requirement is that you reside in
        the Dallas Fort Worth Area.
    policy:
      metro: [springfield]
      allow_us_remote: true
      us_only: true
      require_match: true
    expect:
      decision: no_match
      category: other_us
      evidence_contains: [jd_remote_bound_to_residency]

  - id: location-remote-grant-bound-to-a-preferred-metro
    domain: location
    # The same rule reading the other way: the named metro IS preferred, so the
    # posting still matches — the rule narrows a grant, it never invents one.
    input:
      title: Software Engineer
      location: Remote
      workplace_hint: unknown
      description: >-
        This is a remote role but you must reside in the Springfield area.
    policy:
      metro: [springfield]
      allow_us_remote: true
      us_only: true
      require_match: true
    expect:
      decision: match
      category: metro

  - id: location-remote-grant-with-unreadable-residency-place
    domain: location
    # Never fall back to us_remote: the JD said the grant is bounded, and a place
    # this module cannot parse is a human's call, not a match.
    input:
      title: Software Engineer
      location: Remote
      workplace_hint: unknown
      description: >-
        This is a remote role but you must reside in the Tri-Valley corridor.
    policy:
      metro: [springfield]
      allow_us_remote: true
      us_only: true
      require_match: true
    expect:
      decision: review
      review_contains: [residency_restriction_unparsed]

  - id: location-remote-grant-with-a-us-country-residency-requirement
    domain: location
    # The residency reader could name preferred metros, US states, US hubs and
    # foreign places — and not the United States. So the commonest sentence in
    # US-remote boilerplate read as an unreadable restriction and sent the
    # posting to manual review. A country-wide rule narrows nothing: the whole
    # country satisfies it, which IS the us_remote category.
    input:
      title: Software Engineer
      location: Remote
      workplace_hint: unknown
      description: >-
        This is a fully remote role. You must reside in the United States.
    policy:
      metro: [springfield]
      allow_us_remote: true
      us_only: true
      require_match: true
    expect:
      decision: match
      category: us_remote
      evidence_contains: [jd_residency_us_scope]

  - id: location-remote-grant-with-a-negated-us-residency-clause
    domain: location
    # The guardrail on the rule above. A NEGATED clause states no requirement and
    # says nothing about whether the role is open in the US, so it keeps its
    # review rather than reading the country name as a grant.
    input:
      title: Software Engineer
      location: Remote
      workplace_hint: unknown
      description: >-
        This is a fully remote role. You do not need to reside in the
        United States.
    policy:
      metro: [springfield]
      allow_us_remote: true
      us_only: true
      require_match: true
    expect:
      decision: review
      review_contains: [residency_restriction_unparsed]

  - id: location-remote-grant-without-a-residency-clause-is-unchanged
    domain: location
    # The guardrail on the rule above: an ordinary US-remote posting is untouched.
    input:
      title: Software Engineer
      location: Remote - US
      workplace_hint: unknown
      description: This is a fully remote role.
    policy:
      metro: [springfield]
      allow_us_remote: true
      us_only: true
      require_match: true
    expect:
      decision: match
      category: us_remote
      evidence_contains: [remote_eligible]

  - id: location-bare-remote-word-without-any-us-signal
    domain: location
    # A foreign employer's posting scored us_remote because its entire location
    # field was the word "remote". "Remote" is a work MODE — it asserts no country,
    # and a foreign board writes it exactly as a US one does.
    input:
      title: Travel Consultant
      location: remote
      workplace_hint: unknown
      description: Join our agency team; we are growing fast.
    policy:
      metro: [springfield]
      allow_us_remote: true
      us_only: true
      require_match: true
    expect:
      decision: review
      review_contains: [remote_without_us_scope]

  - id: location-bare-remote-with-us-scope-in-the-jd-body
    domain: location
    # The US signal may come from anywhere. Here the location field has none and
    # the JD supplies it, so the posting keeps its match.
    input:
      title: Software Engineer
      location: Remote
      workplace_hint: unknown
      description: >-
        This is a fully remote role open to candidates anywhere in the United
        States.
    policy:
      metro: [springfield]
      allow_us_remote: true
      us_only: true
      require_match: true
    expect:
      decision: match
      category: us_remote

  - id: title-explicit-exclude-names-the-rule-id
    domain: title
    # `titles.exclude` is the pipeline's HARDEST and largest title drop, and until
    # now no corpus case pinned its rule ID — only the coarse decision. The rule
    # ID is what `search_jobs` reads to attribute the drop to a TERM (the
    # `n_title_excluded` / `title_excluded_terms` counters), so a rename that left
    # `decision: no_match` intact would silently blank that breakdown.
    input:
      title: Engineering Manager, Platform
      profile:
        titles:
          include: [software engineer, platform engineer]
          exclude: [manager, director]
    expect:
      decision: no_match
      accepted: false
      rule_ids: [title.excluded.manager]

  - id: title-profile-include-outranks-the-occupation-lexicon
    domain: title
    # Issue #232: the generic non-technical-occupation lexicon ran BEFORE
    # `titles.include`, so a candidate whose profile explicitly names an
    # occupation still lost every posting for it. The lexicon states what a
    # DEFAULT software search does not want; the profile states what THIS search
    # does want, and the profile is the more specific statement.
    input:
      title: Enterprise Account Executive
      profile:
        titles:
          include: [account executive, sales executive]
          exclude: [manager, director, vp]
    expect:
      decision: match
      accepted: true
      rule_ids: [title.included.account executive]

  - id: title-lexicon-still-drops-an-occupation-the-profile-never-named
    domain: title
    # The include list exempts the titles it names — it does not switch the
    # lexicon off. A clinical title under a sales profile is still a hard drop.
    input:
      title: Registered Nurse
      profile:
        titles:
          include: [account executive, sales executive]
          exclude: [manager, director, vp]
    expect:
      decision: no_match
      accepted: false
      rule_ids: [title.nontechnical_occupation.clinical]

  - id: title-broad-domain-only-include-still-faces-the-lexicon
    domain: title
    # The NARROW form of the #232 fix. A title matched only by a BROAD DOMAIN
    # token (`infrastructure`, `platform`, `compute`) is not an occupation
    # declaration — the token names a technical AREA — so it still faces the
    # lexicon. The wide form ("any include match skips it") was measured on a real
    # corpus and made every affected row worse, promoting finance/legal postings
    # like this one into the review queue.
    input:
      title: Commercial Counsel, Platform Marketplace
      profile:
        titles:
          include: [software engineer, infrastructure, platform, compute]
          exclude: [manager, director]
    expect:
      decision: no_match
      accepted: false
      rule_ids: [title.nontechnical_occupation.legal]

  - id: title-explicit-exclude-still-beats-an-included-occupation
    domain: title
    # Precedence above the lexicon is unchanged: an explicit exclude runs first
    # and still wins, even over an occupation the include list names.
    input:
      title: Sales Manager
      profile:
        titles:
          include: [account executive, sales executive]
          exclude: [manager, director, vp]
    expect:
      decision: no_match
      accepted: false
      rule_ids: [title.excluded.manager]

  - id: sponsorship-refusal-in-the-heads-own-predicate
    domain: sponsorship
    # The worst reading this classifier has produced. Every negation rule in the
    # module read BACKWARD from the sponsorship phrase, and this sentence puts
    # the whole refusal in the head noun's own PREDICATE — so no cue was found,
    # the OFFER substring "h-1b sponsorship" stood unopposed, and the posting
    # graded match/likely/HIGH. Through the live gate with needs_sponsorship it
    # came back kept, labelled `yes`, with an EMPTY review_reasons under BOTH
    # policies: an employer refusing in writing, recommended without a warning
    # to the one candidate who cannot take the job.
    input:
      text: H-1B sponsorship is unavailable.
    expect:
      decision: no_match
      verdict: unlikely
      confidence: high

  - id: sponsorship-unavailable-is-a-negation-cue
    domain: sponsorship
    # Half of the same defect, and independent of direction: "unavailable"
    # carries its negation as a PREFIX, so there is no separate "not" for a cue
    # list to find, and it is the most common word a board refuses with.
    input:
      text: Green card sponsorship is unavailable for this position.
    expect:
      decision: no_match
      verdict: unlikely
      confidence: high

  - id: sponsorship-forward-negation-stops-at-a-relative-clause
    domain: sponsorship
    # The guardrail without which a forward rule invents refusals out of the
    # clearest offers. "not" here modifies the CANDIDATES, and the relative
    # pronoun is the only thing that says so.
    input:
      text: >-
        H-1B sponsorship is available for candidates who are not currently
        authorized to work in the United States.
    expect:
      decision: match
      verdict: likely
      confidence: high

  - id: sponsorship-forward-cue-out-of-reach-is-not-an-offer
    domain: sponsorship
    # The other side of the same bound. The refusal is real but the adjacency
    # test refuses to assert it across a comma at a nine-token gap — and an
    # unreadable sentence is not evidence of an offer either, so it is kept and
    # flagged rather than asserted in either direction.
    input:
      text: >-
        H-1B sponsorship for engineering roles based in our Austin, Texas
        office is not offered.
    expect:
      decision: review
      verdict: unknown
      confidence: low

  - id: sponsorship-field-row-writes-its-predicate-after-a-separator
    domain: sponsorship
    # A compact field row, not a sentence. The separator is a clause break to
    # every other rule in the module, which would leave the forward scope empty.
    input:
      text: 'Visa sponsorship: not available.'
    expect:
      decision: no_match
      verdict: unlikely
      confidence: high

  - id: sponsorship-us-person-requirement-is-a-denial
    domain: sponsorship
    # GH #238. The compact field rules reached "Visa: GC/Citizens" and the phrase
    # list reached "must be a u.s. citizen" (singular, with the article); the
    # same bar written as an ordinary sentence produced no evidence at all, and a
    # live posting requiring exactly these statuses ranked near the top for a
    # candidate in none of them.
    input:
      text: >-
        The successful candidate must establish U.S. Citizen, National, Lawful
        Permanent Resident, Refugee, or Asylee status.
    expect:
      decision: no_match
      verdict: unlikely
      confidence: high

  - id: sponsorship-eeo-citizenship-copy-is-not-a-requirement
    domain: sponsorship
    # The tripwire beside it: non-discrimination boilerplate names the same
    # nouns and is the opposite of a bar. Reading it as one would delete every
    # employer that publishes an EEO statement.
    input:
      text: >-
        We are an equal opportunity employer and do not discriminate on the
        basis of citizenship or national origin.
    expect:
      decision: review
      verdict: unknown

  - id: sponsorship-inclusive-status-list-is-not-a-bar
    domain: sponsorship
    # GH #265. The same status nouns, OFFERED rather than required — and the
    # applicant's own pathway is named in them. A rule that fires on the nouns
    # alone would drop a posting that explicitly invites this candidate.
    input:
      text: >-
        U.S. Citizens, Green Card Holders, EAD Holders, and H-1B transfer
        candidates are encouraged to apply.
    expect:
      decision: match
      verdict: likely
      confidence: high

  - id: sponsorship-transfer-welcome-beside-a-new-petition-denial
    domain: sponsorship
    # GH #265's live shape. The posting says both things, so it is contradictory
    # on its face: kept and flagged for a human read, never dropped and never
    # promoted.
    input:
      text: >-
        We are unable to sponsor new H-1B petitions for this position. H-1B
        transfer candidates are encouraged to apply.
    expect:
      decision: review
      verdict: unknown
      confidence: low

  - id: sponsorship-conditional-offer-is-not-a-settled-offer
    domain: sponsorship
    # GH #304, the direction that costs the candidate. A condition FRONTED to the
    # sentence sits outside the bounded clause scope the hedge rule reads, so a
    # sentence saying the offer has not been decided yet graded likely/HIGH.
    input:
      text: If approved by counsel, the company will sponsor H-1B candidates.
    expect:
      decision: review
      verdict: unknown
      confidence: low

  - id: sponsorship-ordinary-fronted-clause-leaves-the-offer-alone
    domain: sponsorship
    # The bound on the rule above: the subordinator alone is not a condition on
    # the offer, or every sentence that opens with "if" would lose its offer.
    input:
      text: If you are interested in this role, we offer visa sponsorship.
    expect:
      decision: match
      verdict: likely
      confidence: high

  - id: sponsorship-citizenship-bar-survives-export-control-copy
    domain: sponsorship
    # GH #286, sponsorship half. The export-control sense gate exists for ONE
    # ambiguous word — "sponsorship" also means ITAR/EAR licensing — and a
    # citizenship bar has no second sense. Gating it too suppressed the only
    # evidence a firmware posting carried, and the row became the top match for
    # a candidate the complete JD bars outright.
    input:
      text: >-
        Applicants must be a U.S. citizen, lawful permanent resident, or
        protected individual, and must be eligible for a security clearance
        under the International Traffic in Arms Regulations (ITAR).
    expect:
      decision: no_match
      verdict: unlikely
      confidence: high

  - id: sponsorship-bare-offer-without-immigration-context-stays-unknown
    domain: sponsorship
    # The deliberate limit on the #233 recall repair. "Sponsorship is available"
    # with no immigration word anywhere is the wording a conference-booth or
    # employee-programme sentence uses, so it earns a positive only with
    # immigration context in the window — the rule its contiguous twin
    # "sponsorship available" has always followed.
    input:
      text: Sponsorship is available.
    expect:
      decision: review
      verdict: unknown
