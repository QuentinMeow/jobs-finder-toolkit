schema_version: 1
variants:
  - id: location-office-hubs-or-us-remote
    domain: location
    input:
      title: Platform Engineer
      location: San Francisco, CA • New York, NY • United States
      workplace_hint: unknown
      description: >-
        This role can be held from one of our US hubs or remotely in the
        United States.
    policy:
      metro: [springfield]
      allow_us_remote: true
      us_only: true
      require_match: true
    expect:
      decision: match
      category: us_remote
      workplace: remote
      evidence_contains: [jd_office_or_remote]

  - id: location-hybrid-outside-preferred-metro
    domain: location
    input:
      title: Platform Engineer
      location: Austin, TX (Hybrid)
      workplace_hint: hybrid
      description: This is a hybrid role with three office days each week.
    policy:
      metro: [springfield]
      allow_us_remote: true
      us_only: true
      require_match: true
    expect:
      decision: no_match
      category: other_us
      workplace: hybrid

  - id: location-remote-onsite-conflict
    domain: location
    input:
      title: Reliability Engineer
      location: Remote (US)
      workplace_hint: remote
      description: This role must work in-office five days per week.
    policy:
      metro: [springfield]
      allow_us_remote: true
      us_only: true
      require_match: true
    expect:
      decision: review
      review_contains: [remote_onsite_conflict]

  - id: location-mixed-us-foreign-scope
    domain: location
    input:
      title: Software Engineer
      location: Remote - US / London, United Kingdom
      workplace_hint: remote
      description: Build reliable distributed services.
    policy:
      metro: [springfield]
      allow_us_remote: true
      us_only: true
      require_match: true
    expect:
      decision: review
      review_contains: [mixed_us_foreign_scope]

  - id: location-remote-preferred-word-foreign
    domain: location
    input:
      title: Software Engineer
      location: Canada (Remote)
      workplace_hint: remote
      description: Build reliable distributed services.
    # A profile that lists the generic workplace word "remote" among its preferred
    # locations must NOT let "Canada (Remote)" match as a preferred metro.
    policy:
      metro: [springfield, remote]
      allow_us_remote: true
      us_only: true
      require_match: true
    expect:
      decision: no_match
      category: foreign

  - id: location-remote-preferred-word-us-remote
    domain: location
    input:
      title: Software Engineer
      location: Remote - US
      workplace_hint: remote
      description: Build reliable distributed services.
    policy:
      metro: [springfield, remote]
      allow_us_remote: true
      us_only: true
      require_match: true
    expect:
      decision: match
      category: us_remote

  - id: location-distributed-foreign-title
    domain: location
    input:
      title: Senior Software Engineer, Canada
      location: Distributed
      workplace_hint: remote
      description: Build reliable distributed services.
    policy:
      metro: [springfield, remote]
      allow_us_remote: true
      us_only: true
      require_match: true
    expect:
      decision: no_match
      category: foreign

  - id: sponsorship-explicit-offer
    domain: sponsorship
    input:
      text: Visa sponsorship is available for qualified candidates.
    expect:
      decision: match
      verdict: likely
      confidence: high

  - id: sponsorship-explicit-denial
    domain: sponsorship
    input:
      text: This role does not offer sponsorship.
    expect:
      decision: no_match
      verdict: unlikely
      confidence: high

  - id: sponsorship-unrelated-program
    domain: sponsorship
    input:
      text: We sponsor employee learning programs and community events.
    expect:
      decision: review
      verdict: unknown
      confidence: unknown

  - id: sponsorship-conflicting-role-language
    domain: sponsorship
    input:
      text: We sponsor work visas in some cases, but this role has no sponsorship.
    expect:
      decision: review
      verdict: unknown
      confidence: low

  - id: sponsorship-negated-offer-phrase
    domain: sponsorship
    # A denial the phrase list never anticipated: the sentence contains the OFFER
    # substring "offer visa sponsorship" and used to be reported as an explicit
    # offer with high confidence. The negation scope makes the offer phrase a
    # denial of that offer instead.
    input:
      text: This role does not currently offer visa sponsorship.
    expect:
      decision: no_match
      verdict: unlikely
      confidence: high

  - id: sponsorship-negated-offer-distant-cue
    domain: sponsorship
    # Same shape with four words between the cue and the offer phrase, which is
    # what the bounded look-back has to tolerate.
    input:
      text: >-
        We will not consider applicants for employment immigration sponsorship
        or support for this position.
    expect:
      decision: no_match
      verdict: unlikely
      confidence: high

  - id: sponsorship-negated-offer-after-semicolon
    domain: sponsorship
    # The negation lives in its own clause after a semicolon; the eligibility
    # boilerplate before it must not extend the scope, and "no" must still reach
    # the offer phrase that follows it.
    input:
      text: >-
        Must be eligible to work in the United States; no H1-B visa sponsorship
        available.
    expect:
      decision: no_match
      verdict: unlikely
      confidence: high

  - id: sponsorship-double-negation-is-ambiguous
    domain: sponsorship
    # A negated denial is not silently flipped to an offer and not left as a
    # denial either — the posting is returned for a human read.
    input:
      text: It is not true that we cannot sponsor work visas.
    expect:
      decision: review
      verdict: unknown
      confidence: low

  - id: sponsorship-offer-after-clause-restart
    domain: sponsorship
    # Guardrail for the negation scope: the "no" belongs to the relocation
    # clause, and the coordinated clause that follows starts its own subject, so
    # the offer stands. Over-reaching here would hide a job that does sponsor.
    input:
      text: There is no relocation budget, and visa sponsorship is available for this role.
    expect:
      decision: match
      verdict: likely
      confidence: high

  - id: sponsorship-export-control-is-not-a-denial
    domain: sponsorship
    # "Sponsorship" in US export-licensing boilerplate is a different legal
    # sense of the word. It used to score as a high-confidence denial, and the
    # default exclude_negative policy DROPS denials — so export-controlled
    # postings disappeared without a trace.
    input:
      text: >-
        Candidates must be eligible to obtain the required authorizations
        without sponsorship for an export license.
    expect:
      decision: review
      verdict: unknown
      confidence: low

  - id: sponsorship-export-control-beside-a-real-denial
    domain: sponsorship
    # Guardrail: the export-control clause must not suppress an immigration
    # denial sitting next to it.
    input:
      text: >-
        Access to export-controlled data is required. We do not provide visa
        sponsorship for this role.
    expect:
      decision: no_match
      verdict: unlikely
      confidence: high

  - id: sponsorship-caveated-offer-stays-offer
    domain: sponsorship
    # A caveat AFTER the offer ("not guaranteed") qualifies the offer; it is not a
    # denial, and the look-back never sees it.
    input:
      text: >-
        Visa sponsorship is available for this role, though sponsorship is not
        guaranteed.
    expect:
      decision: match
      verdict: likely
      confidence: high

  - id: sponsorship-offer-then-scope-limit-is-an-offer
    domain: sponsorship
    # The regression this corpus exists to prevent. Reading negation structurally
    # was right, but the hedge sentence of an offer-plus-limit carries its own
    # negated offer phrase — denial beat offer and the clearest sponsorship
    # language in a whole market scan graded `unknown`, invisible to the one
    # policy a candidate who NEEDS sponsorship uses. "not for EVERY role" negates
    # a universal and therefore entails that some roles ARE sponsored; only a
    # universal negation ("does not sponsor") is a denial.
    input:
      text: >-
        Visa sponsorship: we do sponsor visas. That said, we are not able to
        sponsor visas for every role and every candidate. If we make you an
        offer we will make every reasonable effort to obtain one for you.
    expect:
      decision: match
      verdict: likely
      confidence: high

  - id: sponsorship-scope-limit-alone-is-not-an-offer
    domain: sponsorship
    # The asymmetry that keeps the safety posture: a scope limit can only REMOVE a
    # denial, never create an offer. With no unhedged offer beside it the answer is
    # unknown — kept and flagged, never asserted.
    input:
      text: We are not able to sponsor every candidate who applies.
    expect:
      decision: review
      verdict: unknown
      confidence: low

  - id: sponsorship-quantified-denial-beside-an-offer-is-not-an-offer
    domain: sponsorship
    # The regression the scope-limit rule introduced, and the reason it is now
    # restricted to DISTRIBUTIVE quantifiers. "for all new hires" bounds the
    # DENIAL's own domain, not an offer: read collectively it is "for the new
    # hires, as a class", i.e. a flat refusal that names who it covers. Reading it
    # as a scope limit DELETED the denial, which dissolved the denial+offer
    # conflict and graded the whole posting `likely`/high — an employer that
    # refuses in writing, shortlisted for the one candidate who needs sponsorship.
    input:
      text: >-
        We offer green card sponsorship to existing employees after two years.
        We are unable to sponsor visas for all new hires.
    expect:
      decision: review
      verdict: unknown
      confidence: low

  - id: sponsorship-quantified-denial-alone-is-not-a-confident-refusal
    domain: sponsorship
    # The same sentence with nothing positive beside it, and the other half of the
    # trade. A quantifier that admits a collective reading cannot weaken a refusal
    # — the phrase stays a DENIAL, which is why the row above is still `review`
    # and not `match`. But it cannot SETTLE one either, and this branch used to
    # answer `no_match`/`unlikely`/high with no review flag: the one ambiguity in
    # this module that produced a confident answer, and a silent drop under both
    # policies. Ambiguity is what `review` is for.
    input:
      text: We are unable to sponsor visas for all new hires.
    expect:
      decision: review
      verdict: unknown
      confidence: low

  - id: sponsorship-unsettled-denial-with-an-unlisted-offer-is-kept
    domain: sponsorship
    # Why the row above is a recall defect and not a technicality. A confident
    # drop only happens when NO `_SPONSOR_POSITIVE` phrase survives the context
    # gate, so the postings it swallowed were the ones whose offer is phrased in
    # words the list does not contain — here an employer stating in writing that
    # it runs an immigration practice handling H-1B and green card cases. "team
    # supports H-1B ... cases" matches no offer phrase, so the `all` clause was
    # the only evidence and the posting was deleted. The same sentence with
    # "every" was kept and flagged; the quantifier was the whole difference.
    input:
      text: >-
        Our immigration team supports H-1B and green card cases, but we do not
        sponsor all roles.
    expect:
      decision: review
      verdict: unknown
      confidence: low

  - id: sponsorship-a-settled-denial-outranks-an-unsettled-one
    domain: sponsorship
    # The guard on the row above: unsettling a denial must not unsettle the
    # POSTING. One flat refusal anywhere still decides it, however many quantified
    # sentences surround it.
    input:
      text: >-
        We are unable to sponsor visas for all new hires. This role does not
        offer sponsorship.
    expect:
      decision: no_match
      verdict: unlikely
      confidence: high

  - id: sponsorship-do-not-sponsor-all-candidates-is-a-denial
    domain: sponsorship
    # Second wording of the same shape, with the offer covering a population the
    # applicant is not in. "all candidates" is not "every candidate": only the
    # distributive form forces the `not-(for every)` reading that entails some
    # candidates ARE sponsored.
    input:
      text: >-
        H-1B sponsorship is part of our benefits package for tenured staff.
        We do not sponsor all candidates.
    expect:
      decision: review
      verdict: unknown
      confidence: low

  - id: sponsorship-at-all-is-still-a-flat-denial
    domain: sponsorship
    # The one place the bare word "all" runs the other way: "at all" INTENSIFIES a
    # denial instead of bounding it, so it is excluded from the ambiguous-
    # quantifier cue by name rather than left to fall out of the pattern.
    input:
      text: We cannot sponsor visas at all for this position.
    expect:
      decision: no_match
      verdict: unlikely
      confidence: high

  - id: sponsorship-all-as-requirement-subject-stays-a-denial
    domain: sponsorship
    # "All" here is the SUBJECT of an eligibility rule, not a quantifier over what
    # is sponsored. A backward quantifier only counts inside the negation it
    # bounds, or a real denial would stop being one.
    input:
      text: All roles require work authorization without sponsorship.
    expect:
      decision: no_match
      verdict: unlikely
      confidence: high

  - id: sponsorship-hedged-offer-is-unclear
    domain: sponsorship
    # The inverse error found in the same scan: a vague discretionary maybe graded
    # `likely` while the unambiguous offer above graded `unknown`, so the two
    # labels were swapped relative to the documented rule. Grading on offer
    # STRENGTH puts them back in order — unhedged offer > hedged offer > silence.
    input:
      text: Limited immigration sponsorship may be available for this role.
    expect:
      decision: review
      verdict: unknown
      confidence: low

  - id: sponsorship-hedge-across-a-coordinator-leaves-the-offer
    domain: sponsorship
    # Guardrail on the hedge scope: "may" belongs to the relocation conjunct, not
    # to the sponsorship offer, so the offer stands.
    input:
      text: We sponsor H-1B visas, and relocation may be discussed separately.
    expect:
      decision: match
      verdict: likely
      confidence: high

  - id: sponsorship-offer-then-unrelated-negation-stays-an-offer
    domain: sponsorship
    # A later negation about something else entirely must not reach the offer.
    input:
      text: >-
        We sponsor visas for this role. We do not offer relocation assistance.
    expect:
      decision: match
      verdict: likely
      confidence: high

  - id: sponsorship-non-immigration-sponsee-is-not-a-denial
    domain: sponsorship
    # The opposite error, and the third shape of the same entry. Offer phrases
    # carried an immigration-context gate; denial phrases carried none, so a
    # bare-verb "sponsor" with an unrelated object matched `do not sponsor` and
    # graded a confident refusal — and the default exclude_negative policy DROPS
    # refusals, so the posting was deleted for a sentence about a street fair.
    input:
      text: We do not sponsor community events.
    expect:
      decision: review
      verdict: unknown
      confidence: unknown

  - id: sponsorship-bare-verb-denial-with-immigration-context-stands
    domain: sponsorship
    # The gate keeps the denials it is supposed to keep: the same bare verb with
    # immigration wording beside it is a real refusal. Written with the PLURAL
    # "visas", which is the wording these denials actually use and the reason
    # the denial gate cannot reuse the offer side's singular-anchored pattern.
    input:
      text: We cannot sponsor visas at all for this position.
    expect:
      decision: no_match
      verdict: unlikely
      confidence: high

  - id: sponsorship-denial-naming-sponsorship-needs-no-context
    domain: sponsorship
    # The tripwire that makes a SYMMETRIC gate wrong, pinned beside the two rows
    # above so the asymmetry cannot be "tidied up" later. This sentence carries
    # no immigration word anywhere in it and is still a real refusal: the object
    # of the verb IS sponsorship, so there is no other sponsee it could be
    # about. Only the bare-verb phrases are gated.
    input:
      text: This role does not offer sponsorship for candidates.
    expect:
      decision: no_match
      verdict: unlikely
      confidence: high

  - id: sponsorship-off-list-denial-with-a-coordinated-object
    domain: sponsorship
    # Detection, not polarity. The denial phrases need "offer sponsorship"
    # contiguous and the offer phrases need "offer visa sponsorship" contiguous,
    # so ONE coordinated object defeats both lists and the negation scope has
    # nothing to act on — the JD said no in writing and the pipeline read it as
    # silence. A negation reaching a bare sponsorship head through an OFFER VERB
    # is a denial of that offer.
    input:
      text: We do not offer relocation or visa sponsorship.
    expect:
      decision: no_match
      verdict: unlikely
      confidence: high

  - id: sponsorship-off-list-denial-other-offer-verbs
    domain: sponsorship
    # Same shape, different verb: the rule is about the offer relation, not
    # about one word.
    input:
      text: We cannot extend visa sponsorship for this position.
    expect:
      decision: no_match
      verdict: unlikely
      confidence: high

  - id: sponsorship-eeo-copy-is-not-a-denial
    domain: sponsorship
    # The guardrail on the rule above, and the reason the OFFER VERB is required
    # rather than merely helpful. This sentence puts a negation cue five tokens
    # from the sponsorship head and is the OPPOSITE of a denial; a generic
    # "cue ... sponsorship head" rule would drop an employer that sponsors.
    input:
      text: >-
        We do not discriminate against candidates who need visa sponsorship.
    expect:
      decision: review
      verdict: unknown
      confidence: unknown

  - id: sponsorship-off-list-denial-window-stays-tight
    domain: sponsorship
    # The second guardrail: a head far from the offer verb is no longer
    # plausibly its object, so the rule declines rather than guessing.
    input:
      text: >-
        We do not offer relocation or housing or transit or gym or childcare
        or visa sponsorship.
    expect:
      decision: review
      verdict: unknown
      confidence: unknown

  - id: sponsorship-unreachable-cue-is-not-an-offer
    domain: sponsorship
    # The high-severity shape. A clause break INSIDE a comma-delimited aside
    # ("and the") truncates the negation scope before the token budget is ever
    # consulted, so "unable" never reaches the offer phrase behind it — and an
    # unreachable cue used to leave that phrase scored as an explicit OFFER.
    # The posting graded `match`/`likely`/high, so `require_positive` handed an
    # employer that refuses sponsorship in writing to the one candidate who
    # cannot take it. Both bounds are unchanged; the reading is recorded as
    # unsettled instead, and the posting is kept and flagged.
    input:
      text: >-
        We are unable, given current headcount constraints and the timeline
        for this particular opening, to offer visa sponsorship.
    expect:
      decision: review
      verdict: unknown
      confidence: low

  - id: sponsorship-unreachable-cue-over-the-token-budget
    domain: sponsorship
    # The OTHER bound, on the same sentence with the coordinator removed: the
    # cue is back in scope at a 9-token gap and refused by the budget. Pinned
    # separately because a repair aimed at one bound leaves the other open.
    input:
      text: >-
        We are unable, given current headcount constraints for this particular
        opening, to offer visa sponsorship.
    expect:
      decision: review
      verdict: unknown
      confidence: low

  - id: sponsorship-settled-denial-outranks-an-unreachable-cue
    domain: sponsorship
    # Guardrail: recording a reading as unsettled must never weaken a refusal
    # the module CAN read.
    input:
      text: >-
        This role does not offer sponsorship. We are unable, given current
        headcount constraints and the timeline for this particular opening,
        to offer visa sponsorship.
    expect:
      decision: no_match
      verdict: unlikely
      confidence: high

  - id: sponsorship-silence-is-unknown
    domain: sponsorship
    # The baseline the two shapes above are graded against.
    input:
      text: Build backend services in Go. Competitive salary and equity.
    expect:
      decision: review
      verdict: unknown
      confidence: unknown

  # --- denial shapes written as patterns rather than phrases ----------------
  # Each pair below is a target and its tripwire, kept adjacent on purpose: the
  # rules here are the first ones in this module that can CREATE a denial from a
  # wording no phrase list contains, and a denial drops the posting under both
  # visa policies. The tripwire is what says the rule stopped where it should.

  - id: sponsorship-coordinated-sponsor-verb-with-adverb
    domain: sponsorship
    # An adverb between the cue and the verb defeats every contiguous phrase
    # ("cannot sponsor" is not present), so this used to read as silence.
    input:
      text: We cannot currently sponsor or support visa transfers.
    expect:
      decision: no_match
      verdict: unlikely
      confidence: high

  - id: sponsorship-coordinated-sponsor-verb-needs-immigration-context
    domain: sponsorship
    # TRIPWIRE for the rule above: its "sponsor" is a bare transitive verb, so
    # it stays behind the immigration gate and a charity is not a visa denial.
    input:
      text: We do not sponsor or support local charities.
    expect:
      decision: review
      verdict: unknown
      confidence: unknown

  - id: sponsorship-stated-as-unnecessary-is-a-denial
    domain: sponsorship
    # "Be authorized without needing sponsorship" is a refusal stated as a
    # requirement; the phrase list needs "without sponsorship" contiguous.
    input:
      text: >-
        Applicants must be authorized to work in the U.S. without the need for
        current or future visa sponsorship.
    expect:
      decision: no_match
      verdict: unlikely
      confidence: high

  - id: sponsorship-needed-by-a-candidate-is-not-a-denial
    domain: sponsorship
    # TRIPWIRE: EEO copy names the same words in the opposite polarity.
    input:
      text: We do not discriminate against candidates who need visa sponsorship.
    expect:
      decision: review
      verdict: unknown
      confidence: unknown

  - id: sponsorship-not-sponsoring-visas-is-a-denial
    domain: sponsorship
    # The gerund is a form neither phrase tuple carries.
    input:
      text: We are not currently sponsoring employment-based visas.
    expect:
      decision: no_match
      verdict: unlikely
      confidence: high

  - id: sponsorship-open-to-sponsoring-is-still-an-offer
    domain: sponsorship
    # TRIPWIRE for the rule above: the negation is part of that pattern rather
    # than left to the clause scope, so the positive form cannot reach it.
    input:
      text: We are open to sponsoring an employment-based visa for this role.
    expect:
      decision: match
      verdict: likely
      confidence: high

  - id: sponsorship-citizenship-required-field-is-a-denial
    domain: sponsorship
    # A Q/A row or table header rather than a sentence.
    input:
      text: 'Citizenship required: Yes'
    expect:
      decision: no_match
      verdict: unlikely
      confidence: high

  - id: sponsorship-citizenship-required-field-answered-no
    domain: sponsorship
    # TRIPWIRE: the same field with the opposite answer is the opposite claim.
    input:
      text: 'Citizenship required: No'
    expect:
      decision: review
      verdict: unknown
      confidence: unknown

  - id: sponsorship-citizenship-is-not-required-is-not-a-denial
    domain: sponsorship
    # TRIPWIRE: a negated requirement must not read as a requirement.
    input:
      text: Citizenship is not required for this role.
    expect:
      decision: review
      verdict: unknown
      confidence: unknown

  - id: sponsorship-visa-field-limited-to-citizens-is-a-denial
    domain: sponsorship
    # A compact field naming every accepted status, none of which is a visa.
    input:
      text: 'Visa: GC/Citizens'
    expect:
      decision: no_match
      verdict: unlikely
      confidence: high

  - id: sponsorship-visa-field-listing-h1b-is-not-a-denial
    domain: sponsorship
    # TRIPWIRE: the value list must be EXHAUSTED by citizen/green-card terms.
    # A field that also lists H-1B is the opposite of a citizens-only field, and
    # the leading term is not what decides it.
    input:
      text: 'Visa: H-1B, OPT, GC, Citizens'
    expect:
      decision: review
      verdict: unknown
      confidence: unknown

  - id: sponsorship-visa-field-citizens-then-h1b-is-not-a-denial
    domain: sponsorship
    # TRIPWIRE, and a real hole found by measurement: without a word boundary
    # after each status term, "citizens?" matches "citizen" INSIDE "Citizens",
    # stranding an "s" that the exhaustiveness check then reads as the end of
    # the list — so this field graded a confident denial while offering H-1B.
    input:
      text: 'Visa: GC/Citizens/H-1B'
    expect:
      decision: review
      verdict: unknown
      confidence: unknown

  - id: sponsorship-us-citizen-required-label-is-a-denial
    domain: sponsorship
    # The same field written with the status noun instead of the abstract one.
    input:
      text: 'U.S. citizen: required'
    expect:
      decision: no_match
      verdict: unlikely
      confidence: high

  # --- a denial scoped to NEW petitions, beside a welcome for transfers ------
  # One sentence saying both things was read as only the first half, and dropped
  # under both visa policies with an empty review_reasons — a posting inviting
  # exactly this candidate, deleted without a trace. The denial is KEPT (so no
  # promotion is reachable) and only its confidence is withdrawn.

  - id: sponsorship-new-petition-denial-beside-a-transfer-welcome
    domain: sponsorship
    input:
      text: >-
        We are unable to sponsor new H-1B petitions; H-1B transfer candidates
        are encouraged to apply.
    expect:
      decision: review
      verdict: unknown
      confidence: low
      evidence_contains: ['unsettled: unable to sponsor']

  - id: sponsorship-initial-petition-denial-beside-a-transfer-welcome
    domain: sponsorship
    input:
      text: >-
        We do not sponsor initial H-1B petitions. Candidates who can transfer
        their H-1B are welcome.
    expect:
      decision: review
      verdict: unknown
      confidence: low

  - id: sponsorship-new-petition-denial-without-a-transfer-signal-stands
    domain: sponsorship
    # TRIPWIRE: half the rule is the OTHER half. With nothing in the posting
    # welcoming a transfer, a bounded refusal is still a refusal.
    input:
      text: We are unable to sponsor new H-1B petitions for this position.
    expect:
      decision: no_match
      verdict: unlikely
      confidence: high

  - id: sponsorship-unbounded-denial-beside-a-transfer-mention-stands
    domain: sponsorship
    # TRIPWIRE: the denial's scope is not limited to new petitions, so a
    # transfer mention elsewhere must not soften it.
    input:
      text: >-
        We do not offer sponsorship of any kind. Please do not ask about
        transferring your H-1B.
    expect:
      decision: no_match
      verdict: unlikely
      confidence: high

  - id: sponsorship-new-hires-is-not-a-new-petition-scope
    domain: sponsorship
    # TRIPWIRE: "new" alone must not bound a denial. "for new hires" is a flat
    # refusal that happens to contain the word, which is why the rule requires a
    # petition/filing/case noun after it.
    input:
      text: >-
        We are unable to sponsor visas for new hires. H-1B transfer candidates
        should not apply.
