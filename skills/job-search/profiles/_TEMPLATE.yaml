# Job-matching profile template. Copy to <label>.yaml and edit.
# Run with: .venv/bin/python skills/job-search/scripts/search_jobs.py --profile <label>

name: Your Name
label: your-label
updated: "YYYY-MM-DD"

titles:
  include:                 # title must contain >=1 of these (word-boundary, case-insensitive)
    - software engineer
  # Optional for a SPECIALIZED search: a title that matches `include` but none of
  # these stays recoverable in the bounded review lane instead of entering the
  # main shortlist. This list is profile-owned; scripts never guess broad words.
  # Leave empty for a general search. Use occupation-bearing phrases such as
  # "ios engineer" or "qa automation sdet", not broad domain words such as
  # "mobile", "application", or "quality". Matching is bounded and
  # separator-insensitive rather than literal-string equality.
  primary: []
  exclude:                 # drop if title contains any of these
    - manager
    - intern

  # Coarse title word classes, applied to the TITLE ALONE before a posting costs
  # anything. Three classes, all yours — nothing here is hardcoded in the scripts,
  # and leaving the block out makes the coarse filter INERT (include/exclude above
  # then decides alone; there is no built-in fallback list).
  #   hard_exclude  always drop, and the drop is counted in the run summary
  #   soft_exclude  never dropped: kept and marked so the AI reads the JD and decides
  #   include       never dropped: "check this one out", the AI reasons about it
  # Matching is case-insensitive and whole-word ("intern" does not match "Internal",
  # "manager" does not match "management"), with a short English inflection allowed
  # ("recruit" matches "Recruiter"). A leading/trailing space demands literal
  # whitespace on that edge, so " manager" keeps "Software Engineer (Manager Tools)".
  # Precedence: hard_exclude > include > soft_exclude (a word in two classes warns).
  word_filter:
    hard_exclude: [intern, new grad, sales, recruit, designer]
    soft_exclude: [" manager", data scientist]
    include: [principal, distinguished]

seniority:
  target: [mid, senior, staff]   # desired level band; roles outside it are demoted
  fit_weight: 6.0                # level-fit penalty per ladder step outside the band (0 = off)
  # yoe_fit_weight: 1.0          # per-year penalty when required YOE > years_experience

# years_experience: null        # your actual YOE; enables the YOE-fit penalty above

keywords:
  strong: []               # high weight (matched in title + description)
  good: []                 # medium weight (matched in description)
  negative: []             # reduce score for honest mis-fits

# The SEARCH-time location gate reads THIS block and nothing else. config.yaml's
# location_policy: is a separate, DRAFT-time gate (handoff.py, status.py
# --check-locations, company_roles.py); editing it changes no search result.
# Keep us_only explicit: the search reads an absent us_only as false (worldwide),
# the draft-time gate reads an absent one as true.
location:
  preferred: [remote]      # whole-word match against posting location
  allow_remote: true
  us_only: true            # keep only US-based / (non-foreign) remote roles; set false to allow global
  require_match: false     # true = hard-filter to ONLY preferred cities / remote

visa:
  needs_sponsorship: false # true if you need work-visa sponsorship
  h1b_transfer: false
  perm_greencard: false
  policy: exclude_negative # exclude_negative | require_positive

# null = no posting-age filter, which is what the pipeline does when this key is
# absent and what example.yaml ships. This template opts in to a 3-day window.
max_age_days: 3            # only postings from the last N days

# Company re-search window (NOT posting age), plus the first-search exception:
# an employer with no row in company-search-log.yaml has never been searched, so
# the narrow window above would hide older-but-unseen roles that are still open.
company_search_log:
  skip_within_days: 7               # skip a company searched within N days
  widen_first_search: true          # false = one window for every run
  first_search_max_age_days: null   # null = no age filter at all on a first search

# Optional: drop JDs that state a minimum YOE above this (keep if unstated; see scoring.experience_ok)
max_years_experience: null

# NOT IMPLEMENTED — nothing reads these, so a number here filters nothing and
# scores nothing. Leave them null; a non-null value makes search_jobs.py print a
# "Profile:" warning to stderr rather than silently ignoring it. (A pay floor
# needs a parsed salary to be trustworthy first: a posting whose pay the parser
# cannot read comes back as "none parsed", and a floor would drop it for being
# too low rather than unknown.)
comp:
  min_base: null
  min_total: null

sources:
  company_tags: [ai-lab, ai-infra, dev-tools]   # tags from companies.yaml
  aggregators: [jobicy, remoteok, themuse]       # keyless; +arbeitnow (EU), +adzuna/jsearch (need keys)
  query_terms:                                   # used by adzuna/jsearch/jobspy
    - software engineer
  query_location: "United States"
  jobspy:
    enabled: true           # Stage 1 Indeed/Google baseline (needs python-jobspy)
    reliable_sites: [indeed, google]   # STAGE 1. (`sites:` is the obsolete name)
    location: "United States"
    results_wanted: 25
    max_terms: 3

diversity:
  max_per_company: 3        # cap rows per employer in the shortlist (0 = no cap)

top_k: 40
