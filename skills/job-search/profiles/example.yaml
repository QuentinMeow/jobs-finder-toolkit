# Job-matching profile — generic software-engineer example.
#
# A realistic, ready-to-copy general software-engineer search: broad SWE / backend
# / platform / full-stack titles, common backend keywords, a couple of major metros
# plus US-remote, and no posting-age filter. It contains ZERO personal specifics —
# copy it to <label>.yaml, tune it, and point config.job_search.default_profile at it.
#
# Run with: .venv/bin/python skills/job-search/scripts/search_jobs.py --profile example

name: Example Candidate
label: example
updated: "2026-01-01"

# ---- Which postings count as candidates (title gate) ----
titles:
  include:                 # title must contain at least one (case-insensitive, word-boundary)
    - software engineer
    - backend engineer
    - back end engineer
    - full stack
    - fullstack
    - platform engineer
    - infrastructure engineer
    - infrastructure
    - distributed systems
    - site reliability
    - reliability engineer
    - cloud engineer
    - api engineer
    - services engineer
  exclude:                 # drop if title contains any of these
    - manager
    - director
    - head of
    - vp
    - intern
    - new grad
    - sales
    - marketing
    - recruiter
    - designer
    - data scientist
    - research scientist
  exclude_neutralize:      # phrases stripped BEFORE applying exclude, so their words
    - member of technical staff   # don't trip a rule (MTS is an IC title, not "staff" level).
    # Listing any one "Member of <X> Staff" spelling declares the whole family:
    # Data / Research / Applied Research / "the Technical" are the same IC title
    # and are neutralized too. A real level word in front ("Senior…", "Principal…")
    # still classifies and still excludes on its own.
  # occupation_review_cap: 300   # optional bounded-rollout guard (default 300): caps
    # how many "plausible/technical but unknown occupation" titles (e.g. generalist
    # MTS-style titles that are neither a clean include match nor a definite non-
    # technical occupation) are preserved to the review queue in one run. Overflow
    # beyond the cap is counted and printed to stderr, never silently dropped.

  # ---- Coarse title word classes (YOURS to choose; nothing is hardcoded) ----
  # Three classes, applied to the TITLE ALONE before a posting costs anything.
  # Matching is case-insensitive and whole-word: "intern" does not match
  # "Internal", "manager" does not match "management", but a short English
  # inflection still counts, so "recruit" matches "Recruiter"/"Recruiting".
  # A LEADING/TRAILING SPACE is a rule, not formatting: it demands literal
  # whitespace on that edge, so " manager" drops "Engineering Manager" while
  # keeping "Software Engineer (Manager Tools)".
  # PRECEDENCE: hard_exclude > include > soft_exclude. A word in two classes is a
  # mistake and the run prints a warning naming the winner.
  # Leave the whole block out and the coarse filter does nothing — include/exclude
  # above then decides alone. There is no built-in fallback list.
  word_filter:
    hard_exclude:          # ALWAYS drop, before the posting costs a detail fetch.
      - intern             # Occupations this profile could never want.
      - internship
      - co-op
      - new grad
      - graduate program
      - apprentice
      - director
      - vice president
      - " vp "             # padded ON PURPOSE — keeps "Software Engineer (VP)"
      - sales
      - marketing
      - recruit            # inflection: also matches Recruiter / Recruiting
      - designer
      - account executive
      - customer success
    soft_exclude:          # NEVER dropped — kept and MARKED so the AI reads the JD
      - " manager"         # padded ON PURPOSE — "Manager Tools" is a product
      - data scientist     # could be an applied ML engineering role in disguise
      - research scientist
    include:               # NEVER dropped — "check this one out", the AI reasons
      - principal          # the seniority words this filter used to drop silently
      - distinguished
      - fellow

seniority:
  target: [mid, senior]    # desired level band (mid..senior here)
  # Level-fit penalty: roles whose parsed Google-equivalent level sits OUTSIDE the
  # target band are demoted by fit_weight per ladder step (so a mid/senior search
  # isn't topped by staff+/entry roles). In-band and unknown levels aren't touched.
  # Set to 0 to disable. Default 6.0.
  fit_weight: 6.0
  # yoe_fit_weight: 1.0    # penalty per year a role's required-min YOE exceeds
                           # years_experience below (only applied when it is set).

# Your actual years of experience (optional). When set, roles asking materially
# more experience are demoted (see seniority.yoe_fit_weight). Leave null to skip.
years_experience: null

# Drop JDs that state a minimum YOE above this (see scoring.experience_ok); keep if unstated.
max_years_experience: null

# ---- Skill / keyword scoring ----
keywords:
  strong:                  # high weight (matched in title + description)
    - python
    - go
    - golang
    - java
    - distributed systems
    - microservices
    - backend
    - api
    - kubernetes
    - aws
  good:                    # medium weight (matched in description)
    - docker
    - terraform
    - postgres
    - mysql
    - redis
    - kafka
    - grpc
    - rest
    - ci/cd
    - cloud
    - sql
    - observability
    - node
    - typescript
  negative: []             # honest mis-fits — reduce score, not hard-filter

# ---- Location / remote ----
# A couple of common metros plus US-remote; keep US-only, don't hard-filter to the
# metros so remote and other US roles still surface (preferred cities add a boost).
location:
  preferred:
    - san francisco
    - new york
    - boston
    - austin
    - remote
  allow_remote: true       # include US-remote roles
  us_only: true            # keep only US-based / (non-foreign) remote roles
  require_match: false     # false = keep all US + remote, boost preferred; true = hard-filter

# ---- Visa / immigration ----
visa:
  needs_sponsorship: false # true if you need work-visa sponsorship
  h1b_transfer: false
  perm_greencard: false
  # exclude_negative: drop only postings that explicitly deny sponsorship (keep yes + unclear)
  # require_positive: keep ONLY postings that explicitly offer sponsorship (much stricter)
  policy: exclude_negative

# ---- Recency (posting age) — OFF by default ----
# `null` = no posting-age filter; every currently-open matching role is considered
# regardless of post date. Set a number (or pass --max-age-days N) for a "posted in
# the last N days" run. This is SEPARATE from the company re-search window below.
max_age_days: null

# ---- Company re-search window (NOT posting age) ----
# Skip a company whose last SUCCESSFUL full-board search (company-search-log.yaml)
# is within this many days.
company_search_log:
  skip_within_days: 7
  # First-ever search at an employer: there is no prior coverage to protect, so the
  # whole board is new information and max_age_days above would hide older-but-
  # unseen roles that are still open. On that one run the window widens; every
  # later run uses max_age_days again.
  widen_first_search: true          # false = one window for every run
  first_search_max_age_days: null   # null = no posting-age filter at all on a first
                                    # search ("find all available roles"); or a number

# ---- Compensation (NOT IMPLEMENTED) ----
# Nothing reads these. There is no pay floor in the pipeline: no filter, score,
# or report consults min_base/min_total, so setting either one changes no result.
# Leave them null. If you set a number anyway, search_jobs.py prints a "Profile:"
# warning to stderr so the setting cannot silently do nothing.
# Why they are not implemented: a floor needs a trustworthy parsed salary, and a
# posting whose pay is stated in a shape the parser does not recognise comes back
# as "none parsed" — a floor would drop it for being too low rather than for
# being unknown. Filter by pay after reading the shortlist.
comp:
  min_base: null
  min_total: null

# ---- Sources ----
sources:
  # 1) Company ATS boards from companies.yaml, selected by tag.
  company_tags: [ai-lab, ai-infra, dev-tools]
  # 2) Cross-company keyword aggregators (keyless, on by default).
  aggregators: [jobicy, remoteok, themuse]
  # Search terms used by keyword aggregators (adzuna/jsearch/jobspy).
  query_terms:
    - software engineer
    - backend engineer
    - platform engineer
    - distributed systems engineer
  query_location: "United States"
  jobspy:
    enabled: true           # Stage 1 Indeed/Google baseline (needs python-jobspy)
    reliable_sites: [indeed, google]   # STAGE 1. (`sites:` is the obsolete name)
    location: "United States"
    results_wanted: 25
    max_terms: 3
    linkedin_fetch_description: false

# ---- Shortlist diversity ----
# Cap how many rows a single employer can occupy in the ranked shortlist, so one
# company with many matching reqs can't dominate the top_k. Set 0 to disable.
diversity:
  max_per_company: 3

# ---- Output ----
top_k: 40
