candidate:
  name: "Jordan Rivers"
  contact_line: "City, ST • jordan.rivers@example.com • linkedin.com/in/jordanrivers"
  name_slug: "Jordan_Rivers"
  title_slug: "Software_Engineer"
paths:
  # Person-first taxonomy: me/ groups career sources, applications, and interview
  # preparation; market/ is what the pipeline scans as a whole. The example tree
  # mirrors the shape a private overlay uses.
  profile_md: "examples/me/career/profile.example.md"
  baseline_yaml: "examples/me/career/resume/baseline.example.yaml"
  reference_docx: "examples/me/career/resume/reference.example.docx"
  company_levels_yaml: "examples/market/logs/company-levels.example.yaml"
  applications_root: "examples/me/applications"
  discoveries_dir: "examples/market/scans/current"
  # The person-first layout puts applications below me/, so its parent is not the
  # overlay root. Benchmark configs intentionally omit this key: deriving their
  # overlay root from a redirected applications root is what isolates writes.
  overlay_root: "examples"
  # The single calendar/todo file the application tracker maintains alongside
  # per-job progress (interview schedules, booking todos, reschedule history).
  # Defaults to <candidate_dir>/calendar.md when omitted; the example keeps it
  # with the rest of the interview material instead, so it is set explicitly.
  calendar_md: "examples/me/interviews/calendar.md"
  # candidate_dir is the fallback parent for the tailoring card and all three
  # skip-logs, and the write target self_measure.py uses for metrics.yaml. It
  # defaults in CODE to <applications_root>/0_profile — the derivation that keeps
  # a benchmark run, which redirects applications_root and nothing else, from
  # writing into the real card and the real skip-log. The example tree has no
  # 0_profile support folder, so it points the key at the market logs instead:
  # a forgotten skip-log key then lands in the right directory rather than an
  # empty one.
  candidate_dir: "examples/market/logs"
  # The tailoring card and the skip-logs each default to
  # <candidate_dir>/<filename>, so all of them are omitted here. Set one only
  # when your layout puts it somewhere else — a purpose-organised private tree,
  # for instance, keeps the card with the profile and the logs with the market
  # research:
  #   tailoring_card:     "private/me/career/tailoring-card.md"
  #   applications_log:   "private/market/logs/applications-log.yaml"
  #   applications_jsonl: "private/market/logs/applications-log.jsonl"
  #   company_search_log: "private/market/logs/company-search-log.yaml"
  # Leave them unset unless you mean it.
job_search:
  default_profile: "example"
#leak_guard:
#  # OPT-IN, and only if you need it. Name a part of your identity that is ALSO
#  # an ordinary English word — a surname like Green, Long, Park or Quick. The
#  # publish leak guard stops reporting that ONE bare word, because otherwise its
#  # word-boundary matching still flags hundreds of honest sentences and no rule
#  # can tell "Menlo Park" from "Alex Park".
#  #
#  # What you give up is exactly that one word standing alone. Your email
#  # address, your linkedin/github handles, your home-directory basename and
#  # every derived name compound (alexgreen, agreen, alex-green, "alex green")
#  # keep full protection, so your full name written any way at all is still
#  # caught. The guard prints the word and the number of occurrences it skipped
#  # on every run — that line is the whole safety story, so read it.
#  english_word_tokens: ["Green"]
generation:
  # Token-usage mode for search + application drafting.
  #   token_saving (default) — routine card-first path: capped render cycles,
  #     <=2 research fetches per cover letter, refilter-first search, no extra sweeps.
  #   full — opt-in for deep multi-source research and extra polish iterations.
  # Hard gates (blacklist/log preflight, location gate, schema validation,
  # check.py, no-fabrication, skill-list gating) are identical in both modes.
  mode: token_saving   # token_saving (default) | full
outlook_email:
  # Personal mailbox settings belong in git-ignored config.yaml. Register a
  # Microsoft public-client app for personal accounts; never add a client secret
  # or Mail.Send permission. OAuth tokens live in the OS keyring, not this file.
  account: ""
  client_id: ""
  tenant: "consumers"
  # Optional explicit company -> email-domain mapping for ``store-review``.
  # Keep real values in git-ignored config.yaml or this private mapping file;
  # shared ATS domains (for example greenhouse.io) are rejected automatically.
  # company_domains:
  #   Example Company: [example.com]
  # company_domains_path: "private/email-company-domains.yaml"
location_policy:
  # Preferred-metro tokens (fictional placeholders for the "City, ST" example persona).
  metro: [springfield, fairview, riverside, lakemont]
  allow_us_remote: true
  us_only: true
retention:
  # Memory/forgetting windows for the gardener (see AGENTS.md "Memory Map").
  # Config readers ignore unknown keys, so this block is optional and safe to omit.
  discovery_ttl_days: 30       # discoveries/market scans go stale in ~30d → move to archive/
  discovery_archive_days: 14   # raw scans FLAGGED for review at 14d (never auto-moved)
  search_log_prune_days: 90    # company-search-log rows older than 90d worth re-searching → prune
  lesson_confirm_days: 180     # LESSONS entries not re-confirmed within 180d → gardener flags demotion
