# CI — the gate for the PUBLIC job-hunting toolkit repo.
#
# Steps 1-3 (vendored-copy drift check, compile, example render + validate) verify
# the toolkit itself and pass in ANY checkout (with or without the private overlay).
#
# Steps 4-6 run the unit tests: resume-writer schema/extraction/render/E2E, the
# shared-module suite (job metadata, the metadata editor, layout/search/backfill),
# and the publish leak-guard suite (structural PII detection, path denylist,
# fail-closed binaries, allowlist copy). These must pass everywhere.
#
# Step 7 is the public leak guard (automation/publish/check_public.py) — a BLOCKING
# gate. This IS the public toolkit repo, so the guard must be completely clean
# (exit 0, zero findings) on every run; ANY finding is a regression. It is armed
# with the `JOBHUNT_PERSONAL_TOKENS` repo secret when present. Fork PRs do NOT
# receive repo secrets, so on a fork the guard runs tokenless (structural PII +
# path / private-skill checks only) — safe by design, because a clean public tree
# passes without any identity tokens.
#
# Step 2d is the public REVIEW gate (automation/publish/review_gate.py) — the other
# blocking gate, and the one `git commit --no-verify` cannot dodge. It fails when
# the published tree changed without a row in automation/publish/review_ledger.yaml.
# It needs the full history (fetch-depth: 0 on checkout).
#
# The `secret-scan` job (gitleaks) is an independent gate that catches credential
# shapes the identity guard does not target.

name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is required by the public review gate (step 2d): it resolves
      # the last acknowledged commit out of automation/publish/review_ledger.yaml and
      # diffs from there, which a depth-1 clone cannot do. The gate detects a shallow
      # checkout and FAILS rather than pass silently, so removing this line turns CI
      # red instead of disarming the gate.
      - name: Check out repository (full history — the review gate needs it)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The toolkit requires Python 3.11+; the requirements (pyyaml, python-docx,
      # pypdf) are tested on 3.12 here.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # LibreOffice powers the DOCX -> PDF conversion in render.py / cover_letter.py.
      # `libreoffice-writer` runs headless and is enough to convert the example
      # resume + cover-letter DOCX to PDF, while being much lighter than the full
      # suite. With it installed, the example render below runs WITHOUT --no-pdf, so
      # check.py's one-page PDF validation also runs. (If you ever need to drop the
      # LibreOffice install to speed CI up, add --no-pdf to the render step — that
      # skips PDF creation and check.py auto-skips the PDF page-count check.)
      - name: Install LibreOffice (DOCX -> PDF for the example render)
        run: sudo apt-get update && sudo apt-get install -y libreoffice-writer

      # 1. Vendored-copy drift check: every skill's scripts/_vendor/ copy must be
      #    byte-identical to its canonical automation/shared/ source.
      - name: Vendored-copy drift check
        run: python automation/vendoring/sync_vendored.py --check

      # 2. Compile everything so no toolkit or skill script has a syntax error.
      - name: Compile all Python
        run: python -m compileall automation skills/*/scripts

      # 2b. Process-layer invariants: queue/task/memory schemas, memory index,
      #     handovers, roadmap freshness (single source of truth: templates/).
      #     NOTE: deliberately WITHOUT --require-roots. Every check no-ops when its
      #     folder is absent so the published export (which ships none of
      #     message-queue/, tasks/, memory/, docs/roadmap/, history/) stays green;
      #     --require-roots is a maintainer-checkout assertion and lives in the
      #     pre-commit hook only.
      - name: Reconciler (process-layer schemas)
        run: python automation/reconcile/reconcile.py --check

      # 2b-ii. Reference + markdown-link check. Until now this routine ran nowhere
      #     but its own unit tests, so a rename could break every link in the tree
      #     while the gardener reported "references: all resolve". It reads both
      #     backticked paths and [text](path) links, and decides a break's fate by
      #     what its SOURCE document is for: a handbook page must resolve, a design
      #     doc is advisory, a dated record is permitted.
      #     NOTE: deliberately WITHOUT --require-roots, exactly like the reconciler
      #     above. That flag asserts every root named in a constant exists, which is
      #     a maintainer-checkout assertion; the published export ships fewer roots
      #     and would go red. It lives in the pre-commit hook only.
      - name: References + markdown links
        run: python automation/gardener/verify_links.py

      # 2c. Maintenance-tooling unit tests: the reconciler's root handling and
      #     retry filing, the gardener routines (link/reference verification,
      #     skill drift, store report), and the private-overlay git hooks.
      - name: Reconciler + gardener + overlay-hook unit tests
        run: |
          python -m unittest discover automation/reconcile/tests
          python -m unittest discover automation/gardener/tests
          python -m unittest discover automation/hooks/tests

      # 2d. Public review gate — every commit that changed the published tree must
      #     carry a row in automation/publish/review_ledger.yaml. This is the copy
      #     `git commit --no-verify` cannot dodge, and it evaluates the TIP: close a
      #     branch with a ledger-only commit acknowledging your last commit (a
      #     ledger-only commit changes no watched file, so it does not re-trigger).
      #     --verify-all recomputes EVERY historical row's digest and file count —
      #     the full append-only check. The pre-commit hook only recomputes a bounded
      #     tail, so integrity of older rows is verified here, where the seconds are
      #     affordable.
      #     On a pull_request the checkout is a MERGE commit whose ledger is a merge
      #     of both sides; --head pins the gate to the PR's own branch tip instead.
      #     No-ops (exit 0, loudly) in a checkout whose history the ledger does not
      #     describe, which is what keeps the exported public mirror's CI green.
      - name: Public review gate (unreviewed public changes)
        env:
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            python automation/publish/review_gate.py --verify-all --head "$PR_HEAD"
          else
            python automation/publish/review_gate.py --verify-all
          fi

      # 3. Render + validate the worked example using the fake "Jordan Rivers"
      #    config.example.yaml. render.py auto-runs check.py (locked fields, real
      #    titles/skills, bullet lengths, one-page PDF, cover-letter prose).
      - name: Example render + validate (fake "Jordan Rivers" config)
        run: |
          JOBHUNT_CONFIG="$PWD/config.example.yaml" \
            python skills/resume-writer/scripts/render.py \
            examples/applications/6_drafted/example-corp-senior-software-engineer/

      # 4. Resume-writer tests: canonical/legacy schema normalization,
      #    multi-employer extraction/render/layout, and one isolated
      #    `_test_application_` search-to-PDF workflow.
      - name: Resume-writer unit tests + multi-experience E2E
        run: >-
          JOBHUNT_CONFIG="$PWD/config.example.yaml"
          python -m unittest discover
          -s skills/resume-writer/scripts/tests

      # 5. Shared-module unit tests: job-metadata extraction/validation, the
      #    formatting-preserving metadata editor, company-levels import, layout
      #    helpers, the search/backfill flows, and the raw-data-layer store
      #    library (atomicity, blobs, capture, ledger, builder, identity,
      #    annotations, validation, locking).
      - name: Shared-module unit tests
        run: python -m unittest discover automation/shared/tests

      # 5b. Validate the fictional example store and enforce its soft size
      #     threshold. The store validator is zone-aware; the size check WARNS a
      #     human over 100 KB and exits 0 (never a silent grow, never a hard block).
      - name: Validate example store + fixture size
        run: python automation/store/validate_store.py examples/data --check-fixture-size

      # 6. Job-search tests include the deterministic high-stakes filter corpus,
      #    snapshot/refilter parity, review preservation, and handoff contracts.
      - name: Job-search unit tests + filter variant corpus
        run: |
          JOBHUNT_CONFIG="$PWD/config.example.yaml" \
            python -m unittest discover \
            -s skills/job-search/scripts/tests \
            -t skills/job-search/scripts/tests
          python skills/job-search/scripts/validate_filter_variants.py --check

      # 7. Publish leak-guard + exporter UNIT TESTS (required gate). Exercises the
      #    guard's structural PII / path-denylist / fail-closed logic and the
      #    allowlist exporter end-to-end.
      - name: Leak-guard + exporter unit tests
        run: python -m unittest discover automation/publish/tests

      # 8. Public leak guard — BLOCKING. This is the public toolkit repo, so the
      #    guard must be completely clean (exit 0, zero findings); ANY finding is a
      #    regression. The guard now FAILS CLOSED when it has no identity tokens
      #    (exit 2), so the secret's presence decides how it is invoked:
      #      * secret present (this repo)  -> armed; a bare run, no escape hatch.
      #        A run that would have been silently tokenless now turns CI RED.
      #      * secret absent (fork PRs get no secrets) -> tokenless by design, so
      #        --allow-unarmed runs the token-INDEPENDENT checks (structural PII,
      #        path denylist, private-skill/overlay trees, fail-closed binaries).
      - name: Public leak guard (blocking; must be clean on this public repo)
        env:
          JOBHUNT_PERSONAL_TOKENS: ${{ secrets.JOBHUNT_PERSONAL_TOKENS }}
        run: |
          if [ -n "$JOBHUNT_PERSONAL_TOKENS" ]; then
            python automation/publish/check_public.py
          else
            echo "::warning::JOBHUNT_PERSONAL_TOKENS absent — leak guard runs UNARMED (token-independent checks only)."
            python automation/publish/check_public.py --allow-unarmed
          fi

  # Independent secret-scanning gate: catches API-key / token / credential shapes
  # across the full history that the identity-token guard does not target.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
