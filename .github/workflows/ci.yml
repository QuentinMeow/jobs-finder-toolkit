# CI keeps fast policy and secret checks on every change, then runs only the
# long test lanes selected by the fail-closed change classifier. Main and manual
# runs always execute the full matrix.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.classify.outputs.matrix }}
      lanes: ${{ steps.classify.outputs.lanes }}
      full: ${{ steps.classify.outputs.full }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      # Full history makes the immutable PR base and head available. The explicit
      # ref prevents classification of GitHub's synthetic merge commit.
      - name: Check out repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Compare with this PR's actual base branch, including a stacked PR base.
      # The stdlib-only classifier falls back to every lane if either immutable
      # event SHA is absent or their merge base cannot be resolved.
      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ] && \
               MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"; then
              python automation/ci/classify_changes.py \
                --base "$MERGE_BASE" \
                --head "$HEAD_SHA"
            else
              python automation/ci/classify_changes.py \
                --force-full "pull-request base or head unavailable"
            fi
          else
            python automation/ci/classify_changes.py \
              --force-full "$EVENT_NAME on $GITHUB_REF"
          fi

  # Policy checks are always blocking. Full history is required by the review
  # ledger, while the token secret remains absent on fork pull requests by design.
  policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run always-on policy gates
        env:
          JOBHUNT_PERSONAL_TOKENS: ${{ secrets.JOBHUNT_PERSONAL_TOKENS }}
          JOBHUNT_REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python automation/gates/run_gates.py --lane policy --jobs 4

  # Each selected lane gets an isolated checkout and runs in parallel with the
  # other lanes. An empty matrix deliberately skips this job.
  tests:
    needs: classify
    if: needs.classify.result == 'success' && needs.classify.outputs.lanes != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.classify.outputs.matrix) }}
    name: tests (${{ matrix.lane }})
    steps:
      - name: Check out repository (pinned head)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install LibreOffice for PDF lanes
        if: matrix.lane == 'render' || matrix.lane == 'resume'
        run: sudo apt-get update && sudo apt-get install -y libreoffice-writer

      - name: Run selected test lane
        env:
          LANE: ${{ matrix.lane }}
        run: python automation/gates/run_gates.py --lane "$LANE" --jobs 4

  # Independent credential-shape scan across the pinned PR branch history.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Preserve the repository's stable required-check context. A skipped tests job
  # is valid only when classification explicitly emitted no long-running lanes.
  build:
    if: always()
    needs: [classify, policy, tests, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required CI results
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          LANES: ${{ needs.classify.outputs.lanes }}
        run: |
          if [ "$CLASSIFY_RESULT" != "success" ] || \
             [ "$POLICY_RESULT" != "success" ] || \
             [ "$SECRET_SCAN_RESULT" != "success" ]; then
            echo "Required CI job failed or was cancelled."
            exit 1
          fi

          if [ "$TESTS_RESULT" = "success" ]; then
            exit 0
          fi

          if [ "$TESTS_RESULT" = "skipped" ] && [ "$LANES" = "[]" ]; then
            echo "No long-running test lanes were selected."
            exit 0
          fi

          echo "Selected tests did not complete successfully."
          exit 1

  # Canonical tree-wide counts are published only after a merge to main. This
  # reporting job is intentionally non-blocking; the policy job gates the checks.
  canonical-counts:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Canonical counts -> job summary
        run: |
          {
            echo "## Canonical counts — \`${GITHUB_SHA:0:12}\` on main"
            echo
            echo "Measured on this tree, after the merge. A total here is true;"
            echo "the same total in a PR body was measured on a branch that has"
            echo "since moved."
            echo
            echo '### References + markdown links'
            echo
            echo '`automation/gardener/verify_links.py`'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          set +e
          python automation/gardener/verify_links.py > "$RUNNER_TEMP/links.log" 2>&1
          LINKS_EXIT=$?
          set -e
          cat "$RUNNER_TEMP/links.log" >> "$GITHUB_STEP_SUMMARY"
          {
            echo '```'
            echo
            echo "verify_links.py exit code: ${LINKS_EXIT}"
            echo
            echo '### Review ledger and eval records'
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          python - automation/publish/review_gate.py evals/results \
            >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          gate_path, results_dir = sys.argv[1], sys.argv[2]

          spec = importlib.util.spec_from_file_location("review_gate", gate_path)
          review_gate = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(review_gate)
          rows = review_gate.load_ledger(Path("."))
          records = sorted(Path(results_dir).glob("*.md"))

          print(f"- review-ledger rows (`{review_gate.LEDGER_REL}`): {len(rows)}")
          print(f"- eval records (`{results_dir}`): {len(records)}")
          PY
